<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inkbrief · 图片 + 文案 → 手绘讲解视频（带配音与字幕）</title>
<meta name="description" content="多张图配多段文案，浏览器里逐屏手绘、本地 TTS 配音、字幕同步，导出 MP4。图片文字音频都不上传。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c4553b'/%3E%3Cpath d='M8 22 L20 10 L24 14 L12 26 Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css?v=8">
<script defer src="js/vendor/pinyin-pro.min.js?v=8"></script>
<script defer src="js/vendor/ort/ort.wasm.min.js?v=8"></script>
<script type="module" src="js/main.js?v=8"></script>
</head>
<body>

<!-- 首屏加载：语音引擎 -->
<div id="boot" class="boot">
  <div class="boot-card">
    <div class="boot-logo">inkbrief</div>
    <p class="boot-sub">图片和文字都不出浏览器。首次使用需要下载一次本地语音引擎。</p>
    <div class="bar"><i id="bootBar"></i></div>
    <p class="boot-note" id="bootText">准备中…</p>
    <button id="bootSkip" class="link">先跳过语音，直接用</button>
  </div>
</div>

<header class="top">
  <div class="brand">
    <span class="mark">inkbrief</span>
    <span class="tag">多图 · 分段配音 · 手绘讲解</span>
  </div>
  <div class="top-actions">
    <label class="sel">
      画幅
      <select id="aspect">
        <option value="1920x1080">横屏 1080p</option>
        <option value="1080x1920">竖屏 1080p</option>
      </select>
    </label>
    <label class="sel" title="一次导出横屏和竖屏两个文件">
      <input type="checkbox" id="dualExport"> 双画幅
    </label>
    <label class="sel">
      音色
      <select id="voice"></select>
    </label>
    <button id="genBtn" class="primary" disabled>生成</button>
    <button id="expBtn" disabled>导出视频</button>
    <span class="undo-group">
      <button id="undoBtn" class="ghost" disabled title="没有可撤销的操作">撤销</button>
      <button id="redoBtn" class="ghost" disabled title="没有可重做的操作">重做</button>
    </span>
  </div>
</header>

<main class="grid">

  <section class="pane pane-assets">
    <h2><b>1</b> 图片</h2>
    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <span id="dropText">拖入图片，或点这里选择<br><small>可一次多选，顺序即出场顺序</small></span>
    </label>
    <div class="thumbs" id="thumbs"></div>
    <p class="hint" id="assetHint"></p>
  </section>

  <section class="pane pane-script">
    <h2><b>2</b> 文案与配音</h2>
    <div class="raw">
      <textarea id="rawScript" rows="4" placeholder="把整篇稿子粘进来，每段之间空一行。&#10;&#10;例如：&#10;今天聊三件事。&#10;&#10;第一，图片不要上传。"></textarea>
      <div class="raw-actions">
        <select id="splitRule" title="怎么切分文案">
          <option value="auto">自动分段</option>
          <option value="blank">按空行</option>
          <option value="line">按每行</option>
          <option value="sentence">按每句</option>
        </select>
        <button id="splitBtn" class="ghost">分段</button>
      </div>
    </div>
    <div class="segs" id="segs">
      <p class="empty">还没有分段。粘稿子后点「按空行分段」。</p>
    </div>
    <p class="hint warn-hint" id="unboundHint" hidden></p>
  </section>

  <section class="pane pane-preview">
    <h2><b>3</b> 预览 <small id="stat"></small></h2>
    <div class="stage-wrap">
      <canvas id="stage" width="1920" height="1080"></canvas>
      <div class="stage-empty" id="stageEmpty">还没有可预览的内容</div>
    </div>
    <div class="transport">
      <button id="playBtn" class="round" disabled aria-label="播放">▶</button>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
      <span id="time" class="time">0.0 / 0.0s</span>
    </div>
    <div class="voice-all">
      <button id="voiceAllBtn" class="ghost" title="给所有还没配音的段都配一遍（已配好的会跳过）">批量配音</button>
      <span id="voiceAllHint" class="hint-inline"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="exp-bar" id="expBar" hidden>
      <div class="bar"><i id="expFill"></i></div>
      <span id="expText">导出中…</span>
      <button id="expCancel" class="link">取消</button>
    </div>
    <p class="hint" id="previewHint"></p>
  </section>

  <!-- 右侧场景设置栏：选中一屏后改它的画面/字幕/时间 -->
  <aside class="pane pane-scene" id="scenePanel" hidden></aside>

</main>

<!-- 生成/配音队列：正在跑什么、哪张失败了 -->
<section class="queue" id="queuePanel" hidden></section>

<!-- 底部时间轴：整片结构一条 -->
<section class="timeline" id="timeline"></section>

<script>
// 极简兜底提示：模块脚本加载失败时不要留一个空白页
window.addEventListener('error', function (e) {
  var b = document.getElementById('bootText');
  if (b && document.getElementById('boot').style.display !== 'none') {
    b.textContent = '加载出错：' + (e.message || '未知错误');
  }
}, true);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inkbrief · 图片 + 文案 → 手绘讲解视频</title>
<meta name="description" content="一张图加几段文案，在浏览器里画成一支带手写字幕的讲解视频。纯前端，图片不上传，导出 WebM。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c4553b'/%3E%3Cpath d='M8 22 L20 10 L24 14 L12 26 Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css?v=4">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark">inkbrief</span>
    <span class="tag">图片 + 文案 → 手绘讲解视频</span>
  </div>
  <div class="top-links">
    <a href="https://github.com/longguanhong0755/inkbrief" target="_blank" rel="noreferrer">GitHub</a>
    <span>MIT</span>
  </div>
</header>

<main class="wrap">
  <aside class="panel">
    <section class="card">
      <h2><span class="num">1</span>选一张图</h2>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="选择图片">
        <input id="file" type="file" accept="image/*" hidden>
        <div id="dropHint" class="drop-hint">
          点这里选图，或把图片拖进来
          <small>图片只在浏览器里处理，不上传</small>
        </div>
        <img id="thumb" alt="" hidden>
      </div>
      <div class="samples">
        <button class="chip" data-sample="cat">示例：小猫</button>
        <button class="chip" data-sample="poster">示例：航空邮件</button>
        <button class="chip" data-sample="photo">示例：照片</button>
      </div>
    </section>

    <section class="card">
      <h2><span class="num">2</span>写几段文案</h2>
      <textarea id="text" spellcheck="false" placeholder="用空行分段，一段对应画面的一块区域。

例如：
一只圆脸小猫

粉色的耳朵和腮红

它正眯着眼睛笑"></textarea>
      <div class="hint"><span id="segInfo">0 段</span><span id="charInfo">0 字</span></div>
    </section>

    <section class="card">
      <h2><span class="num">3</span>生成</h2>
      <details class="adv">
        <summary>高级设置</summary>
        <label>画法
          <select id="style">
            <option value="marker" selected>马克笔</option>
            <option value="pencil">铅笔</option>
            <option value="oil">油画</option>
          </select>
        </label>
        <label>细节
          <select id="detail">
            <option value="0">快（少补笔）</option>
            <option value="1" selected>标准</option>
            <option value="2">细（多补笔）</option>
          </select>
        </label>
        <label>颜色
          <select id="colors">
            <option value="0" selected>自动</option>
            <option value="24">24 色</option>
            <option value="32">32 色</option>
            <option value="40">40 色</option>
          </select>
        </label>
      </details>
      <button id="go" class="primary" disabled>生成预览</button>
      <div id="genStage" class="stage" hidden>
        <div class="bar"><i id="genBar"></i></div>
        <div id="genMsg" class="muted">准备…</div>
      </div>
      <div id="msg" class="msg" hidden></div>
    </section>

    <p class="side-note">纯前端：图片不上传，视频在本机录出来。第一版不做配音。</p>
  </aside>

  <section class="preview">
    <div class="canvas-card">
      <canvas id="cv" width="1280" height="720"></canvas>
      <div id="empty" class="empty">
        <div class="empty-title">这边会出现一支手绘讲解视频</div>
        <div class="empty-sub">左边选图、写文案，点“生成预览”</div>
      </div>
      <div class="controls">
        <button id="play" class="ghost" disabled>播放</button>
        <span id="clock" class="clock">0:00 / 0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" disabled aria-label="回放进度">
        <button id="export" class="primary small" disabled>导出 WebM</button>
      </div>
      <div id="scenes" class="scenes"></div>
    </div>

    <div class="meta-row">
      <div id="stats" class="stats">还没有生成。</div>
      <div id="modeNote" class="note"></div>
    </div>

    <div class="mapping">
      <div class="mapping-head">画面分区 <span>（颜色越深越晚画）</span></div>
      <div class="mapping-body">
        <canvas id="map" width="320" height="180"></canvas>
        <div id="mapInfo" class="muted">生成后显示“第几段对应哪一块”。</div>
      </div>
    </div>

    <div id="expStage" class="stage" hidden>
      <div class="bar"><i id="expBar"></i></div>
      <div id="expMsg" class="muted"></div>
      <button id="cancelExp" class="ghost small">取消</button>
    </div>
  </section>
</main>

<footer class="foot">
  <span>绘制引擎来自 <a href="https://github.com/longguanhong0755/image2strokes" target="_blank" rel="noreferrer">image2strokes</a>（MIT）</span>
  <span>手写字体 Ma Shan Zheng（SIL OFL 1.1）</span>
  <span>本项目 MIT</span>
</footer>

<script type="module" src="js/main.js?v=4"></script>
</body>
</html>
